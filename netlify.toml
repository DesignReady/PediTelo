[build]
  command = "npm run build"

# SESSION_SECRET y SUPERADMIN_PASSWORD solo se usan del lado del servidor (nunca
# llegan al navegador). El escáner de secretos de Netlify los detecta dentro de
# archivos de caché interna del build (Turbopack), que no son parte de lo que se
# le sirve a nadie. Esto no expone las variables, solo evita ese falso positivo.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SESSION_SECRET,SUPERADMIN_PASSWORD"

[[plugins]]
  package = "@netlify/plugin-nextjs"
